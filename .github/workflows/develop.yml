name: CI / CD - Mobile - Develop

on:
  push:
    branches:
      - tests/github-actions-docker

permissions:
  contents: write
  pull-requests: read

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Validar mensagens dos commits
        uses: wagoid/commitlint-github-action@v5
        with:
          configFile: ./commitlint.config.js
          failOnWarnings: false
          helpMessage: "Utilize o padrão: tipo(escopo): descrição (ex: feat(ui): novo botão)"
          continueOnError: true

      - name: Instalar Dependências
        run: npm ci

      - name: Calcular nova versão Preview
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force --prune

          LAST_PROD_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v 'preview' | head -n1 || true)
          [ -z "$LAST_PROD_TAG" ] && LAST_PROD_TAG="v0.0.0"

          BASE_VERSION="${LAST_PROD_TAG#v}"

          BUMP_TYPE=$(node -e "
            const { execSync } = require('child_process');
            try {
              const range = '${LAST_PROD_TAG}' === 'v0.0.0' ? 'HEAD' : '${LAST_PROD_TAG}..HEAD';
              const log = execSync('git log ' + range + ' --oneline', { encoding: 'utf8' });
              if (/feat!|fix!|BREAKING CHANGE/i.test(log)) console.log('major');
              else if (/feat/i.test(log)) console.log('minor');
              else if (/fix/i.test(log)) console.log('patch');
              else console.log('patch');
            } catch {
              console.log('patch');
            }
          ")

          NEXT_BASE=$(npx semver -i $BUMP_TYPE "$BASE_VERSION")
          SHORT_SHA=$(git rev-parse --short HEAD)
          PREVIEW_VERSION="${NEXT_BASE}-preview.${SHORT_SHA}"

          echo "Versão de Preview gerada: $PREVIEW_VERSION"
          echo "new_version=$PREVIEW_VERSION" >> $GITHUB_OUTPUT

      - name: Criar Release Preview (GitHub)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: "Mobile Preview v${{ steps.version.outputs.new_version }}"
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit e Push da Versão
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json
          git commit -m "chore(release): bump version to v${{ steps.version.outputs.new_version }} [skip ci]" || echo "Sem alterações para commitar"
          git push origin HEAD:${{ github.ref_name }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/faculride-mobile:development-v${{ steps.version.outputs.new_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/faculride-mobile:development-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max